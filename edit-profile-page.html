<!-- Edit Profile Page Modal -->
<div id="editProfilePage" class="edit-profile-page-overlay">
    <!-- Header -->
    <header class="edit-profile-page-header">
        <div class="edit-profile-page-logo">
            <img src="assets/dashboard/logo half.png" alt="Logo">
        </div>
        <div class="edit-profile-page-icons">
            <button class="edit-profile-menu-btn" id="editProfileMenuBtn">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <button class="edit-profile-user-btn" id="editProfileUserBtn">
                <img src="assets/images/icons/Jims.png" alt="User">
            </button>
        </div>
    </header>

    <!-- Yellow Line -->
    <div class="edit-profile-yellow-line"></div>

    <!-- Content -->
    <div class="edit-profile-page-content">
        <div class="edit-profile-page-header-text">
            <h2>Edit Profile</h2>
            <p>Update your personal information</p>
        </div>

        <div class="edit-profile-page-container">
            <!-- Form Section -->
            <div class="edit-profile-form-section">
                <h3>Profile Information</h3>
                <form id="editProfilePageForm">
                    <div class="edit-profile-form-group">
                        <label for="editProfileFullName">Full Name <span class="required-star">*</span></label>
                        <input type="text" id="editProfileFullName" placeholder="Full Name" required>
                    </div>

                    <div class="edit-profile-form-group">
                        <label for="editProfileEmail">Email Address <span class="required-star">*</span></label>
                        <input type="email" id="editProfileEmail" placeholder="Gmail" required>
                    </div>

                    <div class="edit-profile-form-group">
                        <label for="editProfileUsername">Username <span class="required-star">*</span></label>
                        <input type="text" id="editProfileUsername" placeholder="@Username" required>
                    </div>

                    <div class="edit-profile-form-group">
                        <label for="editProfilePhone">Phone Number <span class="required-star">*</span></label>
                        <input type="tel" id="editProfilePhone" placeholder="Number" required>
                    </div>

                    <div class="edit-profile-form-buttons">
                        <button type="button" class="edit-profile-cancel-btn" id="editProfileCancelBtn">Cancel</button>
                        <button type="submit" class="edit-profile-save-btn">Save Changes</button>
                    </div>
                </form>
            </div>

            <!-- Picture Section -->
            <div class="edit-profile-picture-section">
                <div class="edit-profile-picture-container">
                    <img src="assets/images/icons/Jims.png" alt="Profile Picture" class="edit-profile-picture" id="editProfilePicturePreview">
                    <div class="edit-profile-picture-info">
                        <button type="button" class="edit-profile-change-btn" id="editProfileChangePicBtn">Change</button>
                        <p class="edit-profile-picture-note">JPG, PNG OR GIF. Max size 2mb</p>
                    </div>
                    <input type="file" id="editProfilePictureInput" accept="image/*" style="display: none;">
                </div>
            </div>
        </div>
    </div>
</div>
