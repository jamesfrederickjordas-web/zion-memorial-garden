<!-- My Reservation Page Modal -->
<div id="myReservationPage" class="my-reservation-page-overlay">
    <!-- Header -->
    <header class="my-reservation-page-header">
        <div class="my-reservation-page-logo">
            <img src="assets/dashboard/logo half.png" alt="Logo">
        </div>
        <div class="my-reservation-page-icons">
            <button class="my-reservation-menu-btn" id="myReservationMenuBtn">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <button class="my-reservation-user-btn" id="myReservationUserBtn">
                <img src="assets/images/icons/Jims.png" alt="User">
            </button>
        </div>
    </header>

    <!-- Content -->
    <main class="my-reservation-content">
        <div class="my-reservation-header">
            <h1>My Reservation</h1>
            <p>View and manage your plot reservation</p>
        </div>

        <div class="my-reservation-box">
            <div class="my-reservation-box-header">
                <h2>My Reservation</h2>
            </div>
            <div class="my-reservation-box-content">
                <img src="assets/images/icons/calendar.png" alt="Calendar" class="calendar-icon">
                <p class="no-reservation-text">You don't have any reservations yet.</p>
                <button class="reserve-plot-btn" id="reservePlotBtn">+ Reserve a Plot</button>
            </div>
        </div>
    </main>
</div>
