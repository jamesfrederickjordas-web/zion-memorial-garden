<div id="registerModal" class="modal-overlay">
    <div class="register-card">
        <span class="close-btn register-close">&times;</span>
        
        <div class="reg-left">
            <img src="assets/images/logos/newlogo.png" alt="Zion Logo" class="reg-logo-overlay">
        </div>
        
        <div class="reg-right">
            <h2>Create Account</h2>
            <form id="newRegisterForm">
                <div class="input-grid">
                    <div class="input-group">
                        <label>Full Name</label>
                        <div class="input-wrapper">
                            <img src="assets/images/icons/image 58.png" alt="User Icon" class="input-icon">
                            <input type="text" id="regFullName" placeholder="Enter your full name" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Username</label>
                        <div class="input-wrapper">
                            <img src="assets/images/icons/image 63.png" alt="At Icon" class="input-icon">
                            <input type="text" id="regUsername" placeholder="Create a username" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Email Address</label>
                        <div class="input-wrapper">
                            <img src="assets/images/icons/image 64.png" alt="Email Icon" class="input-icon">
                            <input type="email" id="regEmail" placeholder="Enter your email" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Phone Number</label>
                        <div class="input-wrapper">
                            <img src="assets/images/icons/image 62.png" alt="Phone Icon" class="input-icon">
                            <input type="tel" id="regPhone" placeholder="Enter 11-digit phone number" maxlength="11" pattern="[0-9]{11}">
                        </div>
                        <span class="error-message" id="phoneError" style="display: none; color: #dc3545; font-size: 12px; margin-top: 3px;">Numbers only (11 digits)</span>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <img src="assets/images/icons/image 61.png" alt="Lock Icon" class="input-icon">
                            <input type="password" id="regPassword" placeholder="Enter your password" required>
                            <img src="assets/images/icons/image 66.png" alt="Toggle View" class="icon-right toggle-password" style="cursor: pointer;">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Confirm Password</label>
                        <div class="input-wrapper">
                            <img src="assets/images/icons/image 60.png" alt="Lock Icon" class="input-icon">
                            <input type="password" id="regConfirmPassword" placeholder="Confirm password" required>
                            <img src="assets/images/icons/image 66.png" alt="Toggle View" class="icon-right toggle-password" style="cursor: pointer;">
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn-create-account">Create Account</button>
            </form>
            <p class="login-prompt">Already have an account? <a href="javascript:void(0);" id="switchToLogin">Sign In</a></p>
        </div>
    </div>
</div>
