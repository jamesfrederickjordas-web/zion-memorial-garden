<div id="loginModal" class="modal">
    <div class="modal-arrow"></div> 
    <div class="modal-content">
        <span class="close-btn login-close">&times;</span>
        <div class="portal-login">
            <img src="assets/images/logos/assetslogo.png" alt="Logo" class="portal-logo">
            <h3>ZION MEMORIAL GARDEN</h3>
            <p class="portal-subtitle">PORTAL LOGIN</p>
            <hr>
            <form id="loginForm">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="Enter your email" required>
                
                <label>Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="loginPassword" placeholder="Enter password" required>
                    <img src="assets/images/icons/image 66.png" alt="Toggle View" class="login-eye-icon toggle-password" style="cursor: pointer;">
                </div>
                
                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember Me</span>
                    </label>
                    <a href="#" class="forgot-pass">Forgot Password?</a>
                </div>
                
                <button type="submit" class="portal-submit">Login</button>
            </form>
            <p class="register-link">Don't have an account? <a href="#" id="showRegisterLink">Register now</a></p>
        </div>
    </div>
</div>
