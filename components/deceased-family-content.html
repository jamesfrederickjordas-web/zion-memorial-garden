<!-- Deceased Family Page Modal -->
<div id="deceasedFamilyPage" class="deceased-family-page-overlay">
    <!-- Header -->
    <header class="deceased-family-page-header">
        <div class="deceased-family-page-logo">
            <img src="assets/dashboard/logo half.png" alt="Logo">
        </div>
        <div class="deceased-family-page-icons">
            <button class="deceased-family-menu-btn" id="deceasedFamilyMenuBtn">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <button class="deceased-family-user-btn" id="deceasedFamilyUserBtn">
                <img src="assets/images/icons/Jims.png" alt="User">
            </button>
        </div>
    </header>

    <!-- Content -->
    <main class="deceased-family-content">
        <h1 class="deceased-family-welcome-title">Deceased Family</h1>

        <div class="deceased-family-grid">
            <!-- Left Section - Reservation Card -->
            <div class="deceased-family-card">
                <div class="tombstone-icon">
                    <img src="assets/dashboard/cross.png" alt="Tombstone">
                </div>
                <button class="deceased-family-btn" id="makeDeceasedFamilyReservationBtn">Make a Reservation</button>
                <p class="deceased-family-text">click to start finding a perfect resting place</p>
            </div>

            <!-- Center Section - Map -->
            <div class="deceased-family-map-section">
                <img src="assets/images/backgrounds/mapping basomuch.png" alt="Cemetery Map" class="cemetery-map">
            </div>

            <!-- Right Section - Status Cards -->
            <div class="deceased-family-status-section">
                <!-- Account Status Card -->
                <div class="deceased-family-status-card">
                    <div class="status-header">
                        <img src="assets/dashboard/shield.png" alt="Shield" class="shield-icon">
                        <div>
                            <p class="status-label">Account Status:</p>
                            <p class="status-active">ACTIVE</p>
                        </div>
                    </div>
                    <p class="member-info">Member Since: September, 2020</p>
                    <p class="member-info">Last Update: Today</p>
                </div>

                <!-- Payment Overview Card -->
                <div class="deceased-family-payment-card">
                    <h3>Payment Overview</h3>
                    <div class="payment-status">
                        <span class="status-badge">Pending Payment</span>
                    </div>
                    <div class="payment-details">
                        <div class="payment-row">
                            <span>Current Due:</span>
                            <span>₱ 0.00</span>
                        </div>
                        <div class="payment-row">
                            <span>Next Payment:</span>
                            <span>₱ 3,127.53</span>
                        </div>
                    </div>
                    <a href="#" class="payment-history">Payment History</a>
                </div>
            </div>
        </div>
    </main>
</div>
