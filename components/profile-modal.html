<!-- Profile Modal - Full Screen -->
<div class="profile-modal-overlay">
    <!-- Header -->
    <header class="profile-modal-header">
        <div class="profile-modal-logo">
            <img src="assets/dashboard/logo half.png" alt="Logo">
        </div>
        <div class="profile-modal-icons">
            <button class="profile-menu-btn" id="profileMenuBtn">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <button class="profile-user-btn" id="profileUserBtn">
                <img src="assets/images/icons/image 6.png" alt="User">
            </button>
        </div>
    </header>

    <!-- Content -->
    <div class="profile-modal-content">
        <div class="profile-header">
            <h2>Profile</h2>
            <p class="profile-subtitle">View and manage your account information</p>
        </div>

        <div class="profile-grid">
            <!-- Left Section - Information Cards -->
            <div class="profile-info-section">
                <div class="info-card">
                    <h3>Personal Information</h3>
                    <div class="info-row">
                        <div class="info-field">
                            <label>FULL NAME</label>
                            <p id="profileFullName">John Doe</p>
                        </div>
                        <div class="info-field">
                            <label>USERNAME</label>
                            <p id="profileUsername">@johndoe</p>
                        </div>
                    </div>
                    <div class="info-row">
                        <div class="info-field">
                            <label>EMAIL ADDRESS</label>
                            <p id="profileEmail">john.doe@example.com</p>
                        </div>
                        <div class="info-field">
                            <label>PHONE NUMBER</label>
                            <p id="profilePhone">+1 234 567 8900</p>
                        </div>
                    </div>
                </div>

                <div class="info-card">
                    <h3>Account Status</h3>
                    <div class="info-row">
                        <div class="info-field">
                            <label>ACCOUNT STATUS</label>
                            <p><span class="status-badge-active">Active</span></p>
                        </div>
                        <div class="info-field">
                            <label>VERIFICATION STATUS</label>
                            <p><span class="status-badge-unverified" id="profileVerificationStatus">Unverified</span></p>
                        </div>
                    </div>
                    <div class="info-row">
                        <div class="info-field">
                            <label>MEMBER SINCE</label>
                            <p id="profileMemberSince">January 2024</p>
                        </div>
                        <div class="info-field">
                            <label>LAST UPDATED</label>
                            <p id="profileLastUpdated">February 15, 2024</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Section - Profile Picture Card -->
            <div class="profile-picture-section">
                <div class="profile-card">
                    <div class="profile-avatar">
                        <img src="assets/images/icons/image 6.png" alt="Profile Picture" id="profilePicture">
                    </div>
                    <h3 id="profileDisplayName">JOHN DOE</h3>
                    <p class="profile-username-display" id="profileUsernameDisplay">@johndoe</p>
                    <span class="user-role-badge">Member</span>
                    
                    <button class="profile-action-btn edit-btn" id="editProfileBtn">
                        Edit Profile
                    </button>
                    <button class="profile-action-btn password-btn">
                        Change Password
                    </button>
                    <button class="back-to-dashboard-btn" id="backToDashboard">
                        Back to Dashboard
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
