<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plot Details - Zion Memorial Garden</title>
    <link rel="stylesheet" href="css/plot-details.css">
</head>
<body>
    <!-- Header -->
    <header class="plot-details-header">
        <div class="header-left">
            <img src="assets/images/logos/assetslogo.png" alt="Zion Memorial Garden Logo" class="header-logo">
        </div>
        <div class="header-right">
            <button class="menu-icon-btn" id="menuIconBtn">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <button class="user-icon-btn" id="userIconBtn">
                <img src="assets/images/icons/Jims.png" alt="User">
            </button>
        </div>
    </header>

    <!-- Yellow Line -->
    <div class="yellow-line"></div>

    <!-- Main Content -->
    <main class="plot-details-main">
        <div class="content-wrapper">
            <!-- Left Section - Legend -->
            <aside class="legend-section">
                <div class="legend-box">
                    <h3>Legend</h3>
                    <div class="legend-items">
                        <div class="legend-item">
                            <span class="legend-color occupied"></span>
                            <span>Occupied</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-color available"></span>
                            <span>Available</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-color reserved"></span>
                            <span>Reserved</span>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Center Section - Map -->
            <section class="map-section">
                <div id="plotGridContainer" class="plot-grid-container">
                    <!-- Grid will be generated by JavaScript -->
                </div>
            </section>

            <!-- Right Section - Back Button -->
            <aside class="back-section">
                <button class="back-to-map-btn" id="backToMapBtn">Back to Map</button>
            </aside>
        </div>
    </main>

    <!-- JavaScript -->
    <script src="js/plot-details.js"></script>
</body>
</html>
